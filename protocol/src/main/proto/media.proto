syntax = "proto3";
package media;
option java_package = "edu.stdiscm.protocol";
option java_multiple_files = true;

// Exactly one header, followed by bounded chunks, then a half-close.
service MediaUpload { rpc Upload(stream UploadFrame) returns (stream UploadReply); }
message UploadHeader { string filename = 1; int64 size = 2; string sha256 = 3; }
message UploadFrame { oneof payload { UploadHeader header = 1; bytes chunk = 2; } }
message UploadReply {
  enum State { ADMITTED = 0; STORED = 1; }
  State state = 1;
  string id = 2;
  string message = 3;
}
